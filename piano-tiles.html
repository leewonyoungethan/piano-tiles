<title>건반 소나기</title>

<style>
/* Layout: one-screen app — mahogany piano case framing a 4-lane ivory keybed; overlays sit on the keybed. */
:root {
  --wood: #2a1613;
  --wood-2: #3b211c;
  --brass: #d6b062;
  --ivory: #f6f1e5;
  --ivory-2: #e7dfcd;
  --ebony: #19161a;
  --felt: #9c2f27;
  --text: #f6f1e5;
  --muted: #c9b8a6;
  --display: "Gowun Batang", "Noto Serif KR", "Apple SD Gothic Neo", serif;
  --ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--wood-2), var(--wood) 70%);
  background-color: var(--wood);
  color: var(--text);
  font-family: var(--ui);
  word-break: keep-all;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  box-sizing: border-box;
  height: 100%;
  max-width: 500px;
  transition: max-width .2s;
  margin: 0 auto;
  display: flex; flex-direction: column; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
.app:fullscreen { background: var(--wood); max-width: none; padding-inline: max(16px, calc((100vw - 560px) / 2)); }
.bar { display: flex; align-items: center; gap: 12px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.35rem; letter-spacing: .02em; color: var(--brass); }
.song { flex: 1; min-width: 0; font-size: .85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button {
  font: inherit; color: var(--text); cursor: pointer;
  background: transparent; border: 1px solid color-mix(in srgb, var(--brass) 55%, transparent);
  border-radius: 999px; padding: 6px 14px; font-size: .85rem;
}
.bar button { white-space: nowrap; flex-shrink: 0; }
.brand { white-space: nowrap; }
@media (max-width: 460px) { .song { display: none; } .bar { justify-content: flex-end; } .brand { margin-right: auto; } .bar button { padding: 6px 10px; } }
#accBtn[aria-pressed="true"] { background: color-mix(in srgb, var(--brass) 22%, transparent); }
button:hover { background: color-mix(in srgb, var(--brass) 14%, transparent); }
button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.stage {
  position: relative; flex: 1; min-height: 0;
  border-radius: 4px; overflow: hidden;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--brass) 45%, transparent), 0 18px 40px rgba(0,0,0,.45);
  background: var(--ivory);
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  padding: 24px; text-align: center;
  overflow-y: auto; justify-content: safe center;
  background: color-mix(in srgb, var(--wood) 88%, transparent);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.overlay h1, .overlay h2 { margin: 0; font-family: var(--display); font-weight: 700; text-wrap: balance; }
.overlay h1 { font-size: 2.3rem; color: var(--brass); }
.overlay h2 { font-size: 1.6rem; }
.lede { margin: 0; color: var(--muted); line-height: 1.6; max-width: 30ch; font-size: .95rem; }
.eyebrow { font-size: .72rem; letter-spacing: .14em; color: var(--muted); }
.app.wide { max-width: 960px; }
.tabs { display: inline-flex; padding: 3px; gap: 3px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--brass) 45%, transparent); }
.tabs button { border: 0; padding: 6px 18px; }
.tabs button[aria-pressed="true"] { background: var(--brass); color: var(--wood); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 360px; }
.chips button { padding: 4px 11px; font-size: .78rem; }
.chips button[aria-pressed="true"] { background: var(--brass); color: var(--wood); border-color: var(--brass); font-weight: 600; }
.level-head { font-size: .72rem; letter-spacing: .14em; color: var(--brass); padding: 10px 2px 2px; text-align: left; font-weight: 600; }
.level-head:first-child { padding-top: 0; }
.level-head[data-level="지옥"], .level-head[data-level="하데스"], .level-head[data-level="죽음"] { color: #e0705f; }
.songs { display: grid; gap: 6px; width: 100%; max-width: 340px; }
.song-btn {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px;
  text-align: left; border-radius: 6px; padding: 8px 14px;
  background: color-mix(in srgb, var(--wood-2) 80%, transparent);
}
.song-btn .t { font-family: var(--display); font-weight: 700; font-size: 1.02rem; }
.song-btn .b { grid-column: 1; font-size: .78rem; color: var(--muted); }
.song-btn .best { grid-row: 1 / span 2; grid-column: 2; font-size: .8rem; color: var(--brass); font-variant-numeric: tabular-nums; }
.big { font-family: var(--display); font-weight: 700; font-size: 4.5rem; line-height: 1; color: var(--brass); font-variant-numeric: tabular-nums; }
.stats { display: flex; gap: 24px; justify-content: center; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { display: block; color: var(--text); font-size: 1.1rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.primary { background: var(--brass); color: var(--wood); border-color: var(--brass); font-weight: 600; padding: 10px 22px; font-size: 1rem; }
.primary:hover { background: color-mix(in srgb, var(--brass) 85%, white); }
.hint { text-align: center; font-size: .75rem; color: var(--muted); letter-spacing: .04em; }
kbd { font-family: var(--ui); border: 1px solid color-mix(in srgb, var(--muted) 50%, transparent); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: .7rem; }
@media (prefers-reduced-motion: reduce) { .overlay { -webkit-backdrop-filter: none; backdrop-filter: none; } }
</style>

  <header class="bar">

      </div>
    </div>
  </main>

<script>
(() => {
  // Public-domain melodies as MIDI note numbers (60 = C4).
  // Original boom-bap loop: every tile is one 8th-note step.
  // d = drums (k kick, s snare, h hat), n = tongue-drum note, b = 808 bass.
  function alleyBeat() {
    const groove = ['kh','h','sh','h','kh','k','sh','h'];
    const fill   = ['kh','h','sh','h','kh','s','s','sh'];
    const bars = [
      { n: [69,null,72,null,76,74,72,null], b: [45,null,null,null,45,48,null,null], d: groove },
      { n: [67,null,69,null,72,null,69,67], b: [43,null,null,null,43,null,40,null], d: groove },
      { n: [69,null,72,null,76,74,79,76],   b: [45,null,null,null,45,48,null,null], d: groove },
      { n: [76,74,72,null,69,null,67,69],   b: [41,null,null,null,43,null,45,null], d: fill },
    ];
    return bars.flatMap(bar => bar.d.map((d, i) => ({ d, n: bar.n[i], b: bar.b[i] })));
  }

  // Original French-house loop: four-on-the-floor, octave-bouncing bass,
  // filtered saw chord stabs (c = chord). Em7 → A7 → Cmaj7 → Bm7.
  function robotDisco() {
    const four = ['k','h','ks','h','k','h','ks','h'];
    const fill = ['k','h','ks','h','ks','s','ks','s'];
    const CH = { Em7: [64,67,71,74], A7: [64,67,69,73], C: [64,67,71,72], Bm7: [62,66,69,74] };
    const stab = [0,1,0,1,0,0,1,1];
    const bars = [
      { c: CH.Em7, b: [40,52,40,52,40,52,43,45], d: four },
      { c: CH.A7,  b: [45,57,45,57,45,57,43,45], d: four },
      { c: CH.C,   b: [48,60,48,60,48,60,47,45], d: four },
      { c: CH.Bm7, b: [47,59,47,59,47,59,50,52], d: four },
      { c: CH.Em7, b: [40,52,40,52,40,52,43,45], d: four, n: [null,null,79,null,76,null,74,76] },
      { c: CH.A7,  b: [45,57,45,57,45,57,43,45], d: four, n: [null,null,73,null,71,null,69,null] },
      { c: CH.C,   b: [48,60,48,60,48,60,47,45], d: four, n: [null,null,72,null,71,null,67,null] },
      { c: CH.Bm7, b: [47,59,47,59,47,59,50,52], d: fill, n: [69,null,71,null,74,null,null,null] },
    ];
    return bars.flatMap(bar => bar.d.map((d, i) => ({ d, b: bar.b[i], c: stab[i] ? bar.c : null, n: bar.n ? bar.n[i] : null })));
  }

  const levelOf = sg => (sg.by.split('·').pop() || '').trim();

  let ac = null, bus = null, drums = null, noiseBuf = null;

    partial(f + 0.7, v * 0.45, ring * 0.9, t, true);   // slow beating shimmer
    partial(f * 2.0, v * 0.16, ring * 0.35, t, false);  // octave
    partial(f * 2.92, v * 0.07, 0.45, t, false);        // inharmonic metal
    partial(f * 5.4, v * 0.035, 0.18, t, false);        // strike sparkle

  // player can play it (2인 모드) or it plays softly under the melody (1인 모드).
  const PROF_MAJ = [6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88];
  const PROF_MIN = [6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];

    for (let tonic = 0; tonic < 12; tonic++) {

        let sc = 0;

    const chords = key.q === 'maj'

      : [[0, 'm'], [5, 'm'], [7, 'M'], [8, 'M'], [3, 'M'], [10, 'M']];

    const out = [];

  const LEFT_CODES = { KeyA: 0, KeyS: 1, KeyD: 2, KeyF: 3, Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3 };

  function layoutBoards() {

  function addRow(b) {
    if (song.drum && b.role !== 'accomp') { b.rows.push({ lane: song.pattern[b.rows.length % song.pattern.length], hitAt: 0 }); return; }
    const tl = song.timeline, k = b.rows.length;

  // ---------- evaporation effect ----------
  // A hit tile flashes warm gold and dissolves into glowing motes of light
  // that drift up and twinkle out, with a thin ring of light spreading out.
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fx = [];
  function glowSprite(core, mid) {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,250,1)');
    gr.addColorStop(0.12, core);
    gr.addColorStop(0.35, mid);

  const SPRITE = {
    gold: glowSprite('rgba(255,214,120,1)', 'rgba(232,170,60,.35)'),

  function evaporate(b, x, y, w, h) {
    if (reduceMotion) return;
    const tone = b.role === 'accomp' ? 'teal' : 'gold';
    const n = Math.max(18, Math.min(48, Math.round(w * h / 260)));
    for (let k = 0; k < n; k++) {
      fx.push({
        kind: 'mote', tone, x: x + w * (0.1 + Math.random() * 0.8), y: y + h * (0.1 + Math.random() * 0.8), s0: s,
        vx: (Math.random() - 0.5) * 30, vy: -(25 + Math.random() * 70),
        size: 5 + Math.random() * 9, sway: Math.random() * 6.28, tw: 8 + Math.random() * 10,
        life: 0.6 + Math.random() * 0.6, t: 0,

      const p = fx[k];
      p.t += dt;
      if (p.t >= p.life) fx.splice(k, 1);
    }
  }
  function drawFx() {
    for (const p of fx) {
      const k = p.t / p.life, scroll = (s - p.s0) * H;
      if (p.kind === 'mote') {
        const x = p.x + p.vx * p.t + Math.sin(p.sway + p.t * 5) * 4;
        const y = p.y + scroll + p.vy * p.t - 30 * p.t * p.t;
        const twinkle = 0.65 + 0.35 * Math.sin(p.sway + p.t * p.tw);
        const sz = p.size * (1 - 0.5 * k);
        g.globalAlpha = Math.pow(1 - k, 1.3) * twinkle;
        g.drawImage(SPRITE[p.tone], x - sz / 2, y - sz / 2, sz, sz);
      } else if (p.kind === 'ring') {
        const e = 1 - Math.pow(1 - k, 3);
        g.globalAlpha = 0.7 * (1 - k);
        g.strokeStyle = p.tone === 'teal' ? 'rgb(95,170,160)' : 'rgb(226,184,96)';
        g.lineWidth = 2.5 * (1 - k) + 0.5;
        g.beginPath(); g.arc(p.x, p.y + scroll, p.r0 + (p.r1 - p.r0) * e, 0, Math.PI * 2); g.stroke();
      } else if (p.kind === 'text') {
        g.globalAlpha = k < 0.15 ? k / 0.15 : 1 - (k - 0.15) / 0.85;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.font = `700 ${Math.round(26 + 6 * Math.sin(Math.min(1, k * 4) * Math.PI))}px "Gowun Batang", serif`;
        g.lineWidth = 4; g.strokeStyle = 'rgba(246,241,229,.95)';
        const y = p.y + scroll - 50 * k;
        g.strokeText(p.text, p.x, y);
        g.fillStyle = 'rgb(176,124,30)'; g.fillText(p.text, p.x, y);
      }
    }
    g.globalAlpha = 1;
  }

  function hit(b, i, src) {
    const r = b.rows[i];
    r.hitAt = performance.now();
    if (!(r.len > 1)) evaporateRow(b, i);
    b.next = i + (r.len || 1);
    skipRests(b);
    if (r.len > 1) { r.state = 'holding'; r.sAt = s; r.fill = 1; b.hold = { i, len: r.len, done: 1, src }; }
    playRow(b, i);
    ensureRows();
  }
  function skipRests(b) {
    for (;;) {
      while (b.rows.length <= b.next) addRow(b);
      if (!b.rows[b.next].rest) return;
      b.next++;
    }
  }
  function playRow(b, i, counts = true) {
    if (counts) score++;
    const n = b.rows[i].note ?? i;
    const acc = song.accomp[n % song.accomp.length];
    if (b.role === 'accomp') playAccomp(acc, 1);
    else if (b.role === 'melody') playMelody(i, n);
    else {
      playMelody(i, n);
      if (soloAccomp && !song.steps) playAccomp(acc, 0.45); // solo: optional soft accompaniment
    }
  }
  const HOLD_BONUS = 5;
  function release(src) {
    boards.forEach(b => {
      if (b.hold && b.hold.src === src) {
        const r = b.rows[b.hold.i];
        r.state = 'released'; r.goneAt = performance.now(); evaporateRow(b, b.hold.i); b.hold = null;
      }
    });
  }
  function updateHolds() {
    boards.forEach(b => {
      const h = b.hold;
      if (!h) return;
      const r = b.rows[h.i];
      r.fill = Math.min(h.len, 1 + (s - r.sAt));
      while (h.done < h.len && s >= r.sAt + h.done) { if (!song.timeline) playRow(b, h.i + h.done, false); h.done++; }
      if (h.done >= h.len && r.fill >= h.len) {
        // held to the end: the press already scored 1, the hold adds 4 → 5 in total
        score += HOLD_BONUS - 1;
        r.state = 'done'; r.goneAt = performance.now();
        evaporateRow(b, h.i); floatText(b, h.i + h.len - 1, `+${HOLD_BONUS}`);
        b.hold = null;
      }
    });
  }

  function lose(b, lane, row, reason) {
    mode = 'fail';
    fail = { b, lane, row, at: performance.now() };
    boards.forEach(bd => { if (bd.hold) { bd.rows[bd.hold.i].state = 'released'; bd.hold = null; } });
    clang();
    rewind = { from: s, to: Math.min(s, ((row + 2) * H - Hh + 1.6 * H) / H), at: performance.now() };
    const id = recordId();
    const best = Math.max(store.get(id), score);
    store.set(id, best);
    clearTimeout(overTimer);
    overTimer = setTimeout(() => {
      $('overReason').textContent = duo ? `${b.name} 쪽이 ${reason}` : reason;
      $('overScore').textContent = score;
      $('overBest').textContent = best;
      $('overBpm').textContent = bpmMax;
      mode = 'over'; over.hidden = false;
      $('retryBtn').focus({ preventScroll: true });
    }, 1100);
  }

  function tap(b, lane, src) {
    if (!b || lane < 0 || lane > 3) return;
    if (mode === 'ready' || (mode === 'play' && b.next === 0)) {
      if (lane === b.rows[0].lane) { mode = 'play'; hit(b, 0, src); }
      return;
    }
    if (mode !== 'play') return;
    if (lane === b.rows[b.next].lane) hit(b, b.next, src);
    else if (song.gentle) b.nudge = { lane, at: performance.now() };   // 왕초보: no game over for a wrong tap
    else lose(b, lane, b.next, '흰 칸을 눌렀어요');
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (mode === 'play') {
      const v = rps();
      bpmMax = Math.max(bpmMax, Math.round(v * 30));
      s += v * dt;
      updateHolds();
      ensureRows();
      for (const b of boards) {
        if (topOf(b.next) > Hh - H * 0.2) { lose(b, b.rows[b.next].lane, b.next, '건반을 놓쳤어요'); break; }
      }
    }
    stepFx(dt);
    if (rewind) {
      const k = Math.min(1, (now - rewind.at) / 350);
      s = rewind.from + (rewind.to - rewind.from) * (1 - Math.pow(1 - k, 3));
      if (k >= 1) rewind = null;
    }
    draw(now);
    requestAnimationFrame(frame);
  }

  function rr(x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }

  function drawBoard(b, now) {
    const x0 = b.x0, bw = b.w, lw = bw / 4;
    g.save();
    g.beginPath(); g.rect(x0, 0, bw, Hh); g.clip();
    const bg = g.createLinearGradient(0, 0, 0, Hh);
    bg.addColorStop(0, COL.ivory2); bg.addColorStop(0.25, COL.ivory); bg.addColorStop(1, COL.ivory);
    g.fillStyle = bg; g.fillRect(x0, 0, bw, Hh);
    g.fillStyle = 'rgba(60,40,30,.16)';
    for (let i = 1; i < 4; i++) g.fillRect(Math.round(x0 + i * lw) - 0.5, 0, 1, Hh);

    const drumLanes = song.drum && b.role !== 'accomp';
    const first = Math.max(0, Math.floor(s - 5));
    for (let i = first; i < b.rows.length; i++) {
      const r = b.rows[i];
      if (r.cont || r.rest) continue;
      const y = topOf(i);
      if (y + H < 0) break;
      if (r.len > 1) { drawLong(b, r, i, x0, lw); continue; }
      if (y > Hh) continue;
      const x = x0 + r.lane * lw, pad = 1.5;
      if (!r.hitAt) {
        const tg = g.createLinearGradient(0, y, 0, y + H);
        tg.addColorStop(0, '#2c272c'); tg.addColorStop(0.85, COL.ebony); tg.addColorStop(1, '#0d0b0e');
        g.fillStyle = tg; rr(x + pad, y + pad, lw - pad * 2, H - pad * 2, 4); g.fill();
        g.fillStyle = 'rgba(255,255,255,.07)'; g.fillRect(x + pad + 4, y + pad + 3, lw - pad * 2 - 8, 2);
        if (b.role === 'accomp') {
          g.fillStyle = 'rgba(95,154,146,.9)'; g.fillRect(x + pad + 4, y + H - pad - 7, lw - pad * 2 - 8, 3);
        }
        if (drumLanes) {
          const kc = KIT[r.lane].color;
          g.fillStyle = kc; g.fillRect(x + pad + 4, y + H - pad - 7, lw - pad * 2 - 8, 3);
          if (!(i === 0 && b.next === 0)) {
            g.textAlign = 'center'; g.textBaseline = 'middle';
            g.font = `600 ${Math.round(Math.min(lw * 0.16, 15))}px "IBM Plex Sans KR", sans-serif`;
            g.fillText(KIT[r.lane].name, x + lw / 2, y + H / 2);
          }
        }
        if (i === 0 && b.next === 0) {
          g.fillStyle = COL.brass; g.textAlign = 'center'; g.textBaseline = 'middle';
          g.font = `700 ${Math.round(Math.min(lw * 0.26, 26))}px "Gowun Batang", serif`;
          g.fillText('시작', x + lw / 2, y + H / 2);
          if (!touchFirst) {
            g.font = `600 12px "IBM Plex Sans KR", sans-serif`; g.fillStyle = 'rgba(246,241,229,.6)';
            g.fillText(`${b.keys[r.lane]} 키`, x + lw / 2, y + H / 2 + 24);
          }
        }
      } else {
        // vanish: the key flashes warm gold and melts away, leaving nothing behind
        const k = (now - r.hitAt) / 220;
        if (k < 1 && !reduceMotion) {
          const grow = 1 + 0.06 * k, w = (lw - pad * 2) * grow, hh = (H - pad * 2) * grow;
          const bx = x + lw / 2 - w / 2, by = y + H / 2 - hh / 2;
          g.globalAlpha = Math.pow(1 - k, 2);
          g.fillStyle = COL.ebony; rr(bx, by, w, hh, 4); g.fill();
          g.globalAlpha = Math.sin(Math.PI * Math.min(1, k * 1.3)) * 0.85;
          g.fillStyle = b.role === 'accomp' ? 'rgb(120,196,184)' : 'rgb(236,196,112)';
          rr(bx, by, w, hh, 4); g.fill();
          g.globalAlpha = 1;
        }
      }
    }

    if (fail && fail.b === b && Math.floor((now - fail.at) / 140) % 2 === 0) {
      g.fillStyle = 'rgba(214,69,61,.85)';
      g.fillRect(x0 + fail.lane * lw, topOf(fail.row), lw, H);
    }

    if (b.nudge) {
      const k = (now - b.nudge.at) / 240;
      if (k < 1) { g.fillStyle = `rgba(60,40,30,${0.14 * (1 - k)})`; g.fillRect(x0 + b.nudge.lane * lw, 0, lw, Hh); }
    }
    g.fillStyle = COL.felt; g.fillRect(x0, 0, bw, 4);

    if (duo && mode !== 'menu') {
      g.textAlign = 'center'; g.textBaseline = 'top';
      g.font = `700 13px "IBM Plex Sans KR", sans-serif`;
      g.fillStyle = b.role === 'accomp' ? 'rgba(60,110,104,.9)' : 'rgba(150,110,40,.95)';
      g.fillText(b.role === 'accomp' ? '반주 · 왼손' : '멜로디 · 오른손', x0 + bw / 2, 92);
    }
    if (drumLanes && mode !== 'menu') {
      g.textAlign = 'center'; g.textBaseline = 'bottom';
      g.font = `700 ${Math.round(Math.min(lw * 0.15, 14))}px "IBM Plex Sans KR", sans-serif`;
      KIT.forEach((kp, i) => { g.fillStyle = kp.color; g.fillText(kp.name, x0 + i * lw + lw / 2, Hh - (touchFirst ? 8 : 24)); });
    }
    if (!touchFirst && (mode === 'ready' || mode === 'play')) {
      g.font = `600 12px "IBM Plex Sans KR", sans-serif`; g.textAlign = 'center'; g.textBaseline = 'bottom';
      g.fillStyle = 'rgba(60,40,30,.35)';
      b.keys.forEach((k, i) => g.fillText(k, x0 + i * lw + lw / 2, Hh - 8));
    }
    g.restore();
  }

  function drawLong(b, r, i, x0, lw) {
    if (r.goneAt) {
      const k = (performance.now() - r.goneAt) / 200;
      if (k >= 1 || reduceMotion) return;
      g.globalAlpha = (1 - k) * (1 - k);
      drawLongBody(b, r, i, x0, lw);
      g.globalAlpha = 1;
      return;
    }
    drawLongBody(b, r, i, x0, lw);
  }
  function drawLongBody(b, r, i, x0, lw) {
    const top = topOf(i + r.len - 1), bottom = topOf(i) + H, pad = 1.5;
    if (top > Hh) return;
    const x = x0 + r.lane * lw, w = lw - pad * 2, h = bottom - top - pad * 2;
    const tg = g.createLinearGradient(0, top, 0, bottom);
    tg.addColorStop(0, '#2c272c'); tg.addColorStop(0.9, COL.ebony); tg.addColorStop(1, '#0d0b0e');
    g.fillStyle = r.state === 'done' ? 'rgba(25,22,26,.12)' : tg;
    rr(x + pad, top + pad, w, h, 6); g.fill();
    // guide line and start dot, so a long tile reads as "press and hold"
    if (!r.hitAt) {
      g.fillStyle = 'rgba(214,176,98,.55)';
      g.fillRect(x + lw / 2 - 1, top + 14, 2, h - 40);
      g.beginPath(); g.arc(x + lw / 2, bottom - 22, Math.min(9, lw * 0.1), 0, Math.PI * 2); g.fill();
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = `700 ${Math.round(Math.min(lw * 0.15, 14))}px "IBM Plex Sans KR", sans-serif`;
      g.fillStyle = 'rgba(246,241,229,.7)';
      g.fillText('길게', x + lw / 2, bottom - 46);
    } else if (r.state !== 'done') {
      const fh = Math.min(h, (r.fill || 1) * H - pad * 2);
      const fg = g.createLinearGradient(0, bottom - fh, 0, bottom);
      const a = r.state === 'released' ? 0.35 : 0.85;
      fg.addColorStop(0, `rgba(240,205,120,${a})`); fg.addColorStop(1, `rgba(214,176,98,${a})`);
      g.fillStyle = fg; rr(x + pad, bottom - pad - fh, w, fh, 6); g.fill();
      if (r.state === 'holding') {
        g.fillStyle = 'rgba(255,240,200,.9)';
        g.fillRect(x + pad + 3, bottom - pad - fh, w - 6, 3);
      }
    } else {
      g.strokeStyle = 'rgba(214,176,98,.5)'; g.lineWidth = 2;
      rr(x + pad + 1, top + pad + 1, w - 2, h - 2, 6); g.stroke();
    }
  }

  // ---------- score board ----------
  // The higher the score, the flashier the number: red → gold → shimmering
  // gold → rainbow → glowing rainbow with sparkles → full rainbow pulse.
  const TIERS = [
    { at: 0,   label: '' },
    { at: 25,  label: '좋아요' },
    { at: 50,  label: '멋져요' },
    { at: 100, label: '대단해요' },
    { at: 200, label: '전설' },
    { at: 400, label: '신' },
  ];
  // Harder songs light up sooner: tier thresholds shrink with the song's level.
  const LEVEL_SCALE = { '왕초보': 1.2, '입문': 1, '쉬움': 0.85, '보통': 0.7, '도전': 0.55, '고수': 0.42, '지옥': 0.3, '하데스': 0.2, '죽음': 0.12 };
  function tierThreshold(i) {
    const lvl = (song.by.split('·').pop() || '').trim();
    const k = LEVEL_SCALE[lvl] || 1;
    return i === 0 ? 0 : Math.max(i * 2, Math.round(TIERS[i].at * k));
  }
  let shownScore = -1, bumpAt = 0, tierAt = 0, lastTier = 0;
  function drawScore(now) {
    let tier = 0;
    TIERS.forEach((tr, i) => { if (score >= tierThreshold(i)) tier = i; });
    if (score !== shownScore) { if (score > shownScore) bumpAt = now; shownScore = score; }
    if (tier !== lastTier) { if (tier > lastTier) tierAt = now; lastTier = tier; }
    const time = now / 1000, text = String(score);
    const fs = Math.round(duo ? Math.min(W * 0.1, 48) : Math.min(W * 0.16, 64));
    const cy = duo ? 20 + fs / 2 : 18 + fs / 2;
    g.save();
    g.font = `700 ${fs}px "Gowun Batang", serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const tw = g.measureText(text).width;
    if (duo) {
      const pw = Math.max(fs * 1.4, tw + 24);
      g.fillStyle = COL.wood; rr(W / 2 - pw / 2, 12, pw, fs + 16, (fs + 16) / 2); g.fill();
    }
    // bump on every point, bigger at higher tiers, and a big pop on reaching a new tier
    const kick = Math.max(0, 1 - (now - bumpAt) / 160) * (0.08 + tier * 0.035);
    const pop = Math.max(0, 1 - (now - tierAt) / 600) * 0.5;
    const pulse = tier >= 5 ? 0.05 * Math.sin(time * 9) : 0;
    const sc = reduceMotion ? 1 : 1 + kick + pop * Math.sin(Math.min(1, (now - tierAt) / 600) * Math.PI) + pulse;
    g.translate(W / 2, cy); g.scale(sc, sc);
    const x0 = -tw / 2, x1 = tw / 2;
    let fill;
    if (tier === 0) fill = duo ? COL.brass : 'rgba(156,47,39,.92)';
    else if (tier === 1) {
      fill = g.createLinearGradient(0, -fs / 2, 0, fs / 2);
      fill.addColorStop(0, '#f4d688'); fill.addColorStop(0.55, '#d19a2e'); fill.addColorStop(1, '#9a6a14');
    } else if (tier === 2) {
      const off = (time * 0.6) % 1;
      fill = g.createLinearGradient(x0 - tw, 0, x1 + tw, 0);
      for (let k = 0; k <= 6; k++) {
        const pos = (k / 6 + off) % 1;
        fill.addColorStop(pos, ['#c8871d', '#f6dc8e', '#e0607a', '#f6dc8e', '#c8871d', '#ffe9a8', '#c8871d'][k]);
      }
    } else {
      // curated palettes instead of a raw rainbow: rose gold → sapphire/amethyst → pearl aurora
      const PAL = {
        3: ['#7e2f42', '#c45d6b', '#eaa08f', '#c45d6b', '#7e2f42'],
        4: ['#26338f', '#5a4fd0', '#a98cf2', '#e7d3ff', '#5a4fd0', '#26338f'],
        5: ['#7fd8c4', '#a9c8ff', '#d7b8ff', '#ffd1b8', '#fff4d6', '#7fd8c4'],
      }[tier];
      const off = (time * (tier === 3 ? 0.35 : tier === 4 ? 0.5 : 0.7)) % 1;
      fill = g.createLinearGradient(x0 - tw * 0.5, -fs / 2, x1 + tw * 0.5, fs / 2);
      const stops = PAL.map((c, k) => [((k / (PAL.length - 1)) + off) % 1, c]).sort((a, b) => a[0] - b[0]);
      stops.forEach(([pos, c]) => fill.addColorStop(pos, c));
    }
    if (tier >= 3) {
      g.shadowColor = tier === 3 ? 'rgba(217,139,139,.7)' : tier === 4 ? 'rgba(120,100,240,.75)' : `rgba(255,236,190,${0.75 + 0.2 * Math.sin(time * 4)})`;
      g.shadowBlur = tier === 3 ? 12 : tier === 4 ? 18 : 24;
    } else if (tier >= 1) { g.shadowColor = 'rgba(214,160,60,.6)'; g.shadowBlur = 6 + tier * 3; }
    if (tier >= 5) {
      // pearl colors need a dark rim to read on the ivory keybed
      g.save(); g.shadowBlur = 0; g.lineWidth = 9; g.strokeStyle = '#2b2550'; g.lineJoin = 'round';
      g.strokeText(text, 0, 0); g.restore();
    }
    if (tier >= 2) {
      g.lineWidth = tier >= 4 ? 5 : 3;
      g.strokeStyle = tier === 4 ? '#e7c26b' : 'rgba(255,250,235,.95)';
      g.strokeText(text, 0, 0);
    }
    g.fillStyle = fill; g.fillText(text, 0, 0);
    g.shadowBlur = 0;
    // orbiting sparkles from the 전설 tier up
    if (tier >= 4 && !reduceMotion) {
      const n = tier === 4 ? 6 : 10, rx = tw / 2 + 16, ry = fs * 0.55;
      for (let k = 0; k < n; k++) {
        const a = time * (tier === 4 ? 2.2 : 3.4) + (k / n) * Math.PI * 2;
        const sz = 10 + 6 * Math.sin(time * 7 + k);
        g.globalAlpha = 0.9;
        g.drawImage(SPRITE.gold, Math.cos(a) * rx - sz / 2, Math.sin(a) * ry - sz / 2, sz, sz);
      }
      g.globalAlpha = 1;
    }
    // tier caption under the number
    if (tier >= 1) {
      g.font = `700 ${Math.round(fs * 0.24)}px "IBM Plex Sans KR", sans-serif`;
      g.fillStyle = ['', '#b07c1e', '#b07c1e', '#a5505d', '#4a3fb8', '#8a6bc9'][tier];
      g.fillText(TIERS[tier].label, 0, fs * 0.62);
    }
    g.restore();
  }

  function draw(now) {
    g.fillStyle = COL.wood; g.fillRect(0, 0, W, Hh);
    if (!song) return;
    boards.forEach(b => drawBoard(b, now));
    drawFx();
    if (mode !== 'menu') drawScore(now);
    if (mode === 'play' || mode === 'fail') {
      g.font = `600 13px "IBM Plex Sans KR", sans-serif`;
      g.textAlign = 'left'; g.fillStyle = 'rgba(60,40,30,.6)';
      g.fillText(`♩ = ${Math.round(rps() * 30)}`, 10, 12);
    }
  }

  // ---------- input ----------
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); audio();
    const rect = cv.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    const b = boards.find(bd => x >= bd.x0 && x < bd.x0 + bd.w);
    if (b) tap(b, Math.floor(((x - b.x0) / b.w) * 4), 'p' + e.pointerId);
  });
  ['pointerup', 'pointercancel'].forEach(ev => window.addEventListener(ev, e => release('p' + e.pointerId)));
  window.addEventListener('keyup', e => release('k' + e.code));
  window.addEventListener('blur', () => boards.forEach(b => { if (b.hold) release(b.hold.src); }));
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.key === 'Escape' && mode !== 'menu') { e.preventDefault(); showMenu(); return; }
    if (mode === 'ready' || mode === 'play') {
      const k = (e.key || '').toLowerCase();
      for (const b of boards) {
        let lane = b.codes[e.code];
        if (lane === undefined) lane = b.jamo[k];
        if (lane !== undefined) { e.preventDefault(); audio(); tap(b, lane, 'k' + e.code); return; }
      }
    }
    if (mode === 'over' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); audio(); newGame(); }
  });

  let menuKind = 'piano';
  const LEDE = {
    piano: '떨어지는 검은 건반을 순서대로 누르면 곡이 연주됩니다. 긴 건반은 끝까지 꾹 누르면 음이 이어지고 5점이에요. 반주는 위의 ‘반주’ 버튼으로 켤 수 있어요. 흰 칸을 누르거나 검은 건반을 놓치면 끝나요.',
    drum: '네 줄이 각각 드럼 하나예요. 떨어지는 패드를 순서대로 치면 비트가 완성됩니다. 놓치거나 빈 칸을 치면 끝나요.',
    duo: '왼쪽 사람은 반주(왼손), 오른쪽 사람은 멜로디(오른손)를 맡아요. 둘이 박자를 맞춰야 곡이 완성되고, 한 명이라도 놓치면 끝나요.',
  };
  function setKind(kind) {
    menuKind = kind;
    $('tabPiano').setAttribute('aria-pressed', String(kind === 'piano'));
    $('tabDrum').setAttribute('aria-pressed', String(kind === 'drum'));
    updateMenuText();
  }
  function setDuo(v) {
    duo = v;
    $('tabSolo').setAttribute('aria-pressed', String(!v));
    $('tabDuo').setAttribute('aria-pressed', String(v));
    updateMenuText();
  }
  function updateMenuText() {
    $('menuEyebrow').textContent = duo ? '2인 협동 · 왼손 반주 + 오른손 멜로디'
      : menuKind === 'drum' ? '킥 · 스네어 · 하이햇 · 크래시' : '4 LANES · BLACK KEYS ONLY';
    $('menuLede').textContent = duo ? LEDE.duo : LEDE[menuKind];
    $('hintKeys').hidden = duo; $('hintDuo').hidden = !duo;
    renderSongs();
  }
  function showMenu() {
    clearTimeout(overTimer);
    mode = 'menu'; over.hidden = true; menu.hidden = false;
    renderSongs();
  }
  let levelFilter = '전체';
  function renderChips() {
    const box = $('levelChips'); box.textContent = '';
    ['전체', ...LEVELS].forEach(lv => {
      const c = document.createElement('button');
      c.type = 'button'; c.textContent = lv;
      c.setAttribute('aria-pressed', String(lv === levelFilter));
      c.addEventListener('click', () => { levelFilter = lv; renderSongs(); });
      box.appendChild(c);
    });
  }
  function renderSongs() {
    renderChips();
    const box = $('songs'); box.textContent = '';
    let lastLevel = '';
    (menuKind === 'drum' ? DRUMS : SONGS).filter(sg => levelFilter === '전체' || levelOf(sg) === levelFilter).forEach(sg => {
      const lv = levelOf(sg);
      if (lv !== lastLevel) {
        lastLevel = lv;
        const h = document.createElement('div');
        h.className = 'level-head'; h.dataset.level = lv;
        const count = (menuKind === 'drum' ? DRUMS : SONGS).filter(x => levelOf(x) === lv).length;
        h.textContent = `${lv} · ${count}곡`;
        box.appendChild(h);
      }
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'song-btn';
      const best = store.get(recordKey(sg));
      b.innerHTML = `<span class="t"></span><span class="b"></span><span class="best"></span>`;
      b.querySelector('.t').textContent = sg.name;
      b.querySelector('.b').textContent = sg.by;
      b.querySelector('.best').textContent = best ? `최고 ${best}` : '새 곡';
      b.addEventListener('click', () => { audio(); newGame(sg); });
      box.appendChild(b);
    });
  }
  $('menuBtn').addEventListener('click', showMenu);
  // Solo accompaniment is off unless the player turns it on (remembered per browser).
  let soloAccomp = false;
  try { soloAccomp = localStorage.getItem('keyshower:accomp') === '1'; } catch {}
  const accBtn = $('accBtn');
  const showAcc = () => { accBtn.textContent = soloAccomp ? '반주 켬' : '반주 끔'; accBtn.setAttribute('aria-pressed', String(soloAccomp)); };
  showAcc();
  accBtn.addEventListener('click', () => {
    soloAccomp = !soloAccomp; showAcc();
    try { localStorage.setItem('keyshower:accomp', soloAccomp ? '1' : '0'); } catch {}
    try { cv.focus({ preventScroll: true }); } catch {}
  });
  const fsBtn = $('fsBtn'), app = document.querySelector('.app');
  if (document.fullscreenEnabled && !touchFirst) {
    fsBtn.hidden = false;
    fsBtn.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await app.requestFullscreen();
      } catch { fsBtn.hidden = true; }
    });
    document.addEventListener('fullscreenchange', () => {
      fsBtn.textContent = document.fullscreenElement ? '창 모드' : '전체 화면';
    });
  }
  $('tabPiano').addEventListener('click', () => setKind('piano'));
  $('tabDrum').addEventListener('click', () => setKind('drum'));
  $('tabSolo').addEventListener('click', () => setDuo(false));
  function setHolds(v) {
    holdsOn = v;
    try { localStorage.setItem('keyshower:holds', v ? '1' : '0'); } catch {}
    $('tabHoldOn').setAttribute('aria-pressed', String(v));
    $('tabHoldOff').setAttribute('aria-pressed', String(!v));
    renderSongs();
  }
  $('tabHoldOn').addEventListener('click', () => setHolds(true));
  $('tabHoldOff').addEventListener('click', () => setHolds(false));
  setHolds(holdsOn);
  $('tabDuo').addEventListener('click', () => setDuo(true));
  $('changeBtn').addEventListener('click', showMenu);
  $('retryBtn').addEventListener('click', () => { audio(); newGame(); });

  new ResizeObserver(resize).observe(stage);
  // Draw a sample board behind the menu so the first frame shows the game.
  song = SONGS[0]; buildAccomp(song); buildTimeline(song); makeBoards();
  resize(); ensureRows(); showMenu(); updateMenuText();
  requestAnimationFrame(frame);
})();
</script>
